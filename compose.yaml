services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: budget_flow
      POSTGRES_USER: budget_flow
      POSTGRES_PASSWORD: budget_flow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_flow -d budget_flow"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
